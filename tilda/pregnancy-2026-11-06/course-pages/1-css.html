<style>
.t-rec:has(#safety){padding-top:0!important;padding-bottom:0!important}
#safety{box-sizing:border-box;position:fixed;inset:0;margin:auto;width:min(640px,calc(100% - 24px));max-width:none;max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);padding:0;border:0;border-radius:16px;background:#fff;color:#303030;overflow:hidden;box-shadow:0 16px 64px #10274440;font:400 15px/1.55 Manrope,Arial,sans-serif}
